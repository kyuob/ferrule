name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_release.py
      - run: python scripts/release.py build --output dist --require-clean
      - name: Check native archive installation
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          archives = [p for p in Path('dist').iterdir() if p.name.endswith(('.tar.gz', '.zip'))]
          assert len(archives) == 1
          subprocess.run([sys.executable, 'scripts/release.py', 'check', str(archives[0])], check=True)
      - uses: actions/upload-artifact@v6
        with:
          name: ferrule-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
