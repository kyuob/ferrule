[package]
name = "ferrule"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Generate Flutter and Rust apps with optional mobile modules"
publish = false

[[bin]]
name = "ferrule"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
roxmltree = "0.20"
yaml-edit = "0.3.6"
renamore = "=0.3.2"

[dev-dependencies]
assert_cmd = "2"
