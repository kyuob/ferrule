schema = 1
id = "ble"
version = "0.2.0"
compatible_versions = ["0.1.0", "0.1.1"]
availability = "available"
description = "Foreground BLE scan, GATT connection/read/write/updates and Rust packet display"
platforms = ["ios", "android"]
requires = ["core"]
conflicts = []
api_modules = ["ble"]
prerequisites = ["Flutter >=3.41 / Dart >=3.11", "Bluetooth hardware and authorization for device validation"]
checks = ["flutter analyze", "cargo test --manifest-path rust/Cargo.toml", "flutter test test/ble_session_test.dart test/ble_page_test.dart", "device scan/GATT/permission/cancellation checks (not yet verified)"]

[flutter_dependencies]
flutter_reactive_ble = "5.5.0"
# 13.x requires an AGP-9 plugin; the Flutter 3.41 scaffold uses AGP 8.
permission_handler = "12.0.1"
device_info_plus = "11.5.0"

[[flutter_pages]]
import = "features/ble/ble_page.dart"
label = "Bluetooth"
widget = "BlePage"

[[files]]
path = "lib/features/ble/ble_page.dart"
template = "ble/ble_page.dart"
mode = "create"

[[files]]
path = "lib/features/ble/ble_transport.dart"
template = "ble/ble_transport.dart"
mode = "create"

[[files]]
path = "lib/features/ble/ble_client.dart"
template = "ble/ble_client.dart"
mode = "create"

[[files]]
path = "lib/features/ble/ble_session.dart"
template = "ble/ble_session.dart"
mode = "create"

[[files]]
path = "rust/src/api/ble.rs"
template = "ble/ble.rs"
mode = "create"

[[files]]
path = "test/fake_ble_client.dart"
template = "ble/fake_ble_client.dart"
mode = "create"

[[files]]
path = "test/ble_session_test.dart"
template = "ble/ble_session_test.dart"
mode = "create"

[[files]]
path = "test/ble_page_test.dart"
template = "ble/ble_page_test.dart"
mode = "create"

[[android]]
element = "uses-feature"
name = "android.hardware.bluetooth_le"
[android.attributes]
required = "false"

[[android]]
element = "uses-permission"
name = "android.permission.BLUETOOTH"
[android.attributes]
maxSdkVersion = "30"

[[android]]
element = "uses-permission"
name = "android.permission.BLUETOOTH_ADMIN"
[android.attributes]
maxSdkVersion = "30"

[[android]]
element = "uses-permission"
name = "android.permission.ACCESS_FINE_LOCATION"
[android.attributes]
maxSdkVersion = "30"

[[android]]
element = "uses-permission"
name = "android.permission.BLUETOOTH_SCAN"
[android.attributes]
usesPermissionFlags = "neverForLocation"

[[android]]
element = "uses-permission"
name = "android.permission.BLUETOOTH_CONNECT"

[[ios]]
key = "NSBluetoothAlwaysUsageDescription"
value = "Discover nearby Bluetooth sensors when you start a scan."
preserve_existing = true
